<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кооп-платформер</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f1f5f9;
    height: 100%;
    touch-action: none;
  }
  #lobby {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e1b4b, #0f172a);
    z-index: 100;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 380px;
    width: 90%;
    text-align: center;
  }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 22px; }
  input {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a; color: #f1f5f9;
    font-size: 16px; margin-bottom: 12px; text-align: center;
  }
  button {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: #6366f1; color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-bottom: 10px;
  }
  button:hover { background: #4f46e5; }
  .secondary { background: #334155; }
  .secondary:hover { background: #475569; }
  .divider {
    display: flex; align-items: center; gap: 12px; margin: 14px 0;
    color: #64748b; font-size: 13px;
  }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:#334155; }
  #status { margin: 10px 0; font-size: 13px; color: #94a3b8; min-height: 18px; }
  #myId {
    background: #0f172a; padding: 10px; border-radius: 10px;
    font-family: monospace; font-size: 20px; letter-spacing: 2px;
    margin: 10px 0; border: 1px dashed #6366f1; cursor: pointer;
  }
  .hidden { display: none !important; }

  #gameWrap {
    position: fixed; inset: 0; z-index: 10;
  }
  canvas { display: block; background: #0b1220; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 14px; pointer-events: none; z-index: 20;
  }
  #levelInfo {
    background: rgba(15,23,42,0.75); padding: 8px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 600; backdrop-filter: blur(4px);
  }
  #progressInfo {
    background: rgba(15,23,42,0.75); padding: 8px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 700; backdrop-filter: blur(4px);
  }
  #connBadge {
    position: fixed; top: 54px; left: 14px; z-index: 20;
    background: rgba(15,23,42,0.75); padding: 4px 10px; border-radius: 8px;
    font-size: 11px; color: #f87171;
  }
  #connBadge.ok { color: #4ade80; }
  #msgOverlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 50; background: rgba(15,23,42,0.55); pointer-events: none; opacity: 0;
    transition: opacity 0.25s;
  }
  #msgOverlay.show { opacity: 1; pointer-events: all; }
  #msgBox {
    background: #1e293b; padding: 26px 30px; border-radius: 16px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #msgBox p { margin: 0 0 16px; color: #94a3b8; font-size: 14px; }

  #controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 18px; z-index: 30; pointer-events: none;

    width: 66px; height: 66px; border-radius: 50%;
    background: rgba(99,102,241,0.35); border: 2px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center;
    pointer-events: all; user-select: none; margin: 0 6px;
  }
  .ctrlBtn:active { background: rgba(99,102,241,0.7); }
  #dpad { display: flex; }
  #jumpBtn { width: 76px; height: 76px; }

<body>

<div id="lobby">
  <div class="card" id="lobbyCard">
    <h1>🏃 Кооп-платформер</h1>
    <p class="subtitle">Проходите уровни вдвоём — сначала один игрок должен добраться до флажка, потом второй</p>
    <button id="createBtn">Создать комнату</button>
    <div class="divider">или</div>
    <input id="joinInput" placeholder="Код комнаты друга" maxlength="12">
    <button id="joinBtn" class="secondary">Подключиться</button>
    <div id="status"></div>
  </div>
  <div class="card hidden" id="waitingCard">
    <h1>Ждём друга...</h1>
    <p class="subtitle">Отправьте ему этот код:</p>
    <div id="myId"></div>
    <button id="copyBtn" class="secondary">📋 Скопировать код</button>
    <div id="status2"></div>
  </div>
</div>

<div id="gameWrap" class="hidden">
  <div id="hud">
    <div id="levelInfo">Уровень 1</div>
    <div id="progressInfo">🚩 0/2</div>
  </div>
  <div id="connBadge">● офлайн</div>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <div id="dpad">
      <div class="ctrlBtn" id="leftBtn">◀</div>
      <div class="ctrlBtn" id="rightBtn">▶</div>
    </div>
    <div class="ctrlBtn" id="jumpBtn">⤴</div>
  </div>
</div>

<div id="msgOverlay">
  <div id="msgBox">
    <h2 id="msgTitle"></h2>
    <p id="msgText"></p>
    <button id="msgBtn" class="hidden">Дальше</button>
  </div>
</div>

<script>
/* ========================= НАСТРОЙКА СЕТИ ========================= */
const lobby = document.getElementById('lobby');
const lobbyCard = document.getElementById('lobbyCard');
const waitingCard = document.getElementById('waitingCard');
const statusEl = document.getElementById('status');
const status2El = document.getElementById('status2');
const myIdEl = document.getElementById('myId');
const gameWrap = document.getElementById('gameWrap');
const connBadge = document.getElementById('connBadge');

let peer, conn;
let myRole = null; // 'A' (host, синий) or 'B' (гость, оранжевый)
let connected = false;

function genRoomCode() {
  return 'coop-' + Math.random().toString(36).substring(2, 8);
}

function initPeer(id) {
  peer = new Peer(id, { host: '0.peerjs.com', port: 443, secure: true });
  peer.on('open', (id) => {
    if (myRole === 'A') {
      myIdEl.textContent = id.replace('coop-', '');
      waitingCard.classList.remove('hidden');
      lobbyCard.classList.add('hidden');
    }
  });
  peer.on('connection', (c) => {
    conn = c;
    conn.on('open', () => setupConnection());
  });
  peer.on('error', (err) => {
    statusEl.textContent = 'Ошибка: ' + err.type + '. Попробуйте снова.';
    status2El.textContent = statusEl.textContent;
  });
}

document.getElementById('createBtn').onclick = () => {
  myRole = 'A';
  statusEl.textContent = 'Создаём комнату...';
  initPeer(genRoomCode());
};

document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('joinInput').value.trim();
  if (!code) { statusEl.textContent = 'Введите код комнаты'; return; }
  myRole = 'B';
  statusEl.textContent = 'Подключаемся...';
  peer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true });
  peer.on('open', () => {
    conn = peer.connect('coop-' + code);
    conn.on('open', () => setupConnection());
  });
  peer.on('error', (err) => {
    statusEl.textContent = 'Не удалось подключиться. Проверьте код.';
  });
};

document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(myIdEl.textContent).then(() => {
    document.getElementById('copyBtn').textContent = '✅ Скопировано!';
    setTimeout(() => document.getElementById('copyBtn').textContent = '📋 Скопировать код', 1500);
  });
};

function setupConnection() {
  if (connected) return; // защита от двойного вызова
  lobby.classList.add('hidden');
  gameWrap.classList.remove('hidden');
  connected = true;
  connBadge.textContent = '● в сети';
  connBadge.classList.add('ok');
  conn.on('data', handleNetData);
  conn.on('close', () => {
    connected = false;
    connBadge.textContent = '● отключен';
    connBadge.classList.remove('ok');
    showMsg('⚠️ Связь потеряна', 'Соединение с другом прервалось.', false);
  });
  startGame();
}

function send(data) {
  if (conn && conn.open) conn.send(data);
}

/* ========================= УРОВНИ ========================= */
const LEVELS = [

    ],

    ],

];

/* ========================= СОСТОЯНИЕ ИГРЫ ========================= */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const GRAVITY = 0.0022;
const MOVE_SPEED = 0.36;
const JUMP_VEL = -0.85;
const FRICTION = 0.85;

let currentLevelIdx = 0;
let level = null;
let camX = 0;

let players = {
  A: {x:0, y:0, vx:0, vy:0, w:34, h:44, onGround:false, finished:false, alive:true, color:'#60a5fa'},
  B: {x:0, y:0, vx:0, vy:0, w:34, h:44, onGround:false, finished:false, alive:true, color:'#fb923c'}
};

let input = { left:false, right:false, jump:false };
let remoteInput = { left:false, right:false, jump:false };
let remoteState = null;

let lastTime = performance.now();
let running = false;

function applyLoadLevel(idx) {
  currentLevelIdx = idx;
  level = JSON.parse(JSON.stringify(LEVELS[idx]));
  players.A.x = level.startA.x; players.A.y = level.startA.y;
  players.A.vx = 0; players.A.vy = 0; players.A.finished = false; players.A.alive = true;
  players.B.x = level.startB.x; players.B.y = level.startB.y;
  players.B.vx = 0; players.B.vy = 0; players.B.finished = false; players.B.alive = true;
  camX = 0;
  document.getElementById('levelInfo').textContent = level.name;
  updateProgressHud();
}

// Хост — источник истины по смене уровня; рассылает индекс при переходе
function loadLevel(idx) {
  applyLoadLevel(idx);
  if (myRole === 'A') send({ type:'levelSync', levelIdx: idx });
}

function updateProgressHud() {
  let count = (players.A.finished ? 1 : 0) + (players.B.finished ? 1 : 0);
  document.getElementById('progressInfo').textContent = `🚩 ${count}/2`;
}

function myPlayer() { return myRole === 'A' ? players.A : players.B; }
function otherPlayer() { return myRole === 'A' ? players.B : players.A; }

/* ========================= ФИЗИКА ========================= */
function platformRect(p, t) {
  let x = p.x, y = p.y;
  if (p.moving) {
    const off = Math.sin(t * p.speed + (p.phase||0) * Math.PI) * p.range;
    if (p.axis === 'x') x += off; else y += off;
  }
  return {x, y, w:p.w, h:p.h};
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function updatePlayerPhysics(p, inp, dt, t) {
  if (p.finished || !p.alive) return;

  if (inp.left) { p.vx -= MOVE_SPEED * dt; }
  if (inp.right) { p.vx += MOVE_SPEED * dt; }
  p.vx *= FRICTION;
  if (Math.abs(p.vx) > 0.6) p.vx = 0.6 * Math.sign(p.vx);

  if (inp.jump && p.onGround) {
    p.vy = JUMP_VEL;
    p.onGround = false;
  }

  p.vy += GRAVITY * dt;
  if (p.vy > 1.2) p.vy = 1.2;

  // Горизонтальное перемещение + столкновения
  p.x += p.vx * dt;
  let pRect = {x:p.x, y:p.y, w:p.w, h:p.h};
  for (const plat of level.platforms) {
    const pr = platformRect(plat, t);
    if (rectsOverlap(pRect, pr)) {
      if (p.vx > 0) p.x = pr.x - p.w;
      else if (p.vx < 0) p.x = pr.x + pr.w;
      p.vx = 0;
      pRect = {x:p.x, y:p.y, w:p.w, h:p.h};
    }
  }

  // Вертикальное перемещение + столкновения
  p.y += p.vy * dt;
  p.onGround = false;
  pRect = {x:p.x, y:p.y, w:p.w, h:p.h};
  for (const plat of level.platforms) {
    const pr = platformRect(plat, t);
    if (rectsOverlap(pRect, pr)) {
      if (p.vy > 0) {
        p.y = pr.y - p.h;
        p.vy = 0;
        p.onGround = true;
        if (plat.moving && plat.axis === 'x') {
          const off1 = Math.sin(t * plat.speed + (plat.phase||0)*Math.PI) * plat.range;
          const off2 = Math.sin((t+dt) * plat.speed + (plat.phase||0)*Math.PI) * plat.range;
          p.x += (off2 - off1);
        }
      } else if (p.vy < 0) {
        p.y = pr.y + pr.h;
        p.vy = 0;
      }
      pRect = {x:p.x, y:p.y, w:p.w, h:p.h};
    }
  }

  // Шипы
  for (const s of level.spikes) {
    if (rectsOverlap(pRect, s)) {
      if (p.alive) {
        p.alive = false;
        setTimeout(() => respawnPlayer(p), 500);
      }
      return;
    }
  }

  // Портал
  for (const port of level.portals) {
    const ra = {x:port.a.x-14, y:port.a.y-14, w:28, h:28};
    if (rectsOverlap(pRect, ra)) {
      p.x = port.b.x; p.y = port.b.y - p.h/2;
      p.vy = 0;
      break;
    }
    const rb = {x:port.b.x-14, y:port.b.y-14, w:28, h:28};
    if (rectsOverlap(pRect, rb)) {
      p.x = port.a.x; p.y = port.a.y - p.h/2;
      p.vy = 0;
      break;
    }
  }

  // Падение в пропасть
  if (p.y > level.height + 100) {
    if (p.alive) {
      p.alive = false;
      setTimeout(() => respawnPlayer(p), 300);
    }
  }

  // Флажок
  const flagRect = {x: level.flag.x - 20, y: level.flag.y - 60, w: 40, h: 60};
  if (!p.finished && rectsOverlap(pRect, flagRect)) {
    p.finished = true;
    updateProgressHud();
    onPlayerFinished(p === players.A ? 'A' : 'B');
  }
}

function respawnPlayer(p) {
  const isA = p === players.A;
  const start = isA ? level.startA : level.startB;
  p.x = start.x; p.y = start.y; p.vx = 0; p.vy = 0; p.alive = true;
}

function onPlayerFinished(who) {
  if (who === myRole) {
    send({ type:'finished', who });
    if (!(players.A.finished && players.B.finished)) {
      showToast('Вы дошли! Ждём напарника... 🚩');
    }
  }
  const bothDone = players.A.finished && players.B.finished;
  if (bothDone && myRole === 'A') {
    setTimeout(() => nextLevel(), 700);
  }
}

function nextLevel() {
  if (currentLevelIdx + 1 >= LEVELS.length) {
    showMsg('🏆 Игра пройдена!', 'Вы вдвоём прошли все уровни. Красавцы!', false);
    running = false;
    return;
  }
  showMsg(`✅ Уровень пройден!`, `Переходим к следующему уровню...`, false, 1400);
  setTimeout(() => {
    loadLevel(currentLevelIdx + 1);
  }, 1400);
}

/* ========================= UI СООБЩЕНИЯ ========================= */
let toastTimeout = null;
function showToast(text) {
  const overlay = document.getElementById('msgOverlay');
  const title = document.getElementById('msgTitle');
  const body = document.getElementById('msgText');
  const btn = document.getElementById('msgBtn');
  title.textContent = text;
  body.textContent = '';
  btn.classList.add('hidden');
  overlay.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => overlay.classList.remove('show'), 1300);
}

function showMsg(title, text, needsBtn, autoHideMs) {
  const overlay = document.getElementById('msgOverlay');
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgText').textContent = text;
  const btn = document.getElementById('msgBtn');
  btn.classList.toggle('hidden', !needsBtn);
  overlay.classList.add('show');
  if (autoHideMs) setTimeout(() => overlay.classList.remove('show'), autoHideMs);
}

/* ========================= СЕТЕВАЯ СИНХРОНИЗАЦИЯ ========================= */
function handleNetData(data) {
  if (data.type === 'input') {
    remoteInput = data.input;
  } else if (data.type === 'state') {
    remoteState = data.state;
  } else if (data.type === 'levelSync') {
    if (myRole === 'B' && data.levelIdx !== currentLevelIdx) {
      applyLoadLevel(data.levelIdx);
    }
  } else if (data.type === 'finished') {
    const p = data.who === 'A' ? players.A : players.B;
    if (!p.finished) {
      p.finished = true;
      updateProgressHud();
    }
    if (players.A.finished && players.B.finished && myRole === 'A') {
      setTimeout(() => nextLevel(), 700);
    }
  }
}

let netSendTimer = 0;
function sendNetworkUpdates(dt) {
  netSendTimer += dt;
  if (netSendTimer < 33) return; // ~30 раз в секунду
  netSendTimer = 0;
  send({ type:'input', input });
  const me = myPlayer();
  send({ type:'state', state: {x:me.x, y:me.y, vx:me.vx, vy:me.vy, onGround:me.onGround, alive:me.alive, finished:me.finished} });
}

/* ========================= РИСОВАНИЕ ========================= */
function draw(t) {
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0,0,canvas.width, canvas.height);

  const me = myPlayer();
  camX = me.x - canvas.width/2 + me.w/2;
  camX = Math.max(0, Math.min(camX, Math.max(0, level.width - canvas.width)));

  ctx.save();
  ctx.translate(-camX, 0);

  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i=0;i<40;i++){
    const x = (i*137) % level.width;
    const y = (i*97) % (level.height*0.6);
    ctx.fillRect(x, y, 3, 3);
  }

  for (const plat of level.platforms) {
    const pr = platformRect(plat, t);
    const grad = ctx.createLinearGradient(pr.x, pr.y, pr.x, pr.y+pr.h);
    if (plat.moving) {
      grad.addColorStop(0, '#a78bfa'); grad.addColorStop(1, '#7c3aed');
    } else {
      grad.addColorStop(0, '#334155'); grad.addColorStop(1, '#1e293b');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(pr.x, pr.y, pr.w, 4);
  }

  ctx.fillStyle = '#ef4444';
  for (const s of level.spikes) {
    const n = Math.max(2, Math.floor(s.w / 20));
    const sw = s.w / n;
    for (let i=0;i<n;i++) {
      ctx.beginPath();
      ctx.moveTo(s.x + i*sw, s.y + s.h);
      ctx.lineTo(s.x + i*sw + sw/2, s.y);
      ctx.lineTo(s.x + i*sw + sw, s.y + s.h);
      ctx.closePath();
      ctx.fill();
    }
  }

  for (const port of level.portals) {
    drawPortal(port.a, '#22d3ee', t);
    drawPortal(port.b, '#f472b6', t);
  }

  drawFlag(level.flag.x, level.flag.y);

  drawPlayer(players.A, t);
  drawPlayer(players.B, t);

  ctx.restore();
}

function drawPortal(pos, color, t) {
  ctx.save();
  ctx.translate(pos.x, pos.y);
  ctx.rotate(t*0.002);
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(0,0,14,20,0,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = color + '55';
  ctx.beginPath();
  ctx.ellipse(pos.x,pos.y,10,16,0,0,Math.PI*2);
  ctx.fill();
}

function drawFlag(x, y) {
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, y-60);
  ctx.stroke();
  const bothDone = players.A.finished && players.B.finished;
  ctx.fillStyle = bothDone ? '#22c55e' : '#eab308';
  ctx.beginPath();
  ctx.moveTo(x, y-60);
  ctx.lineTo(x+34, y-50);
  ctx.lineTo(x, y-40);
  ctx.closePath();
  ctx.fill();
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  // Ручная реализация скруглённого прямоугольника — работает во всех браузерах,
  // в отличие от ctx.roundRect, которого нет в старых версиях Chrome/Android WebView.
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPlayer(p, t) {
  if (!p.alive) return;
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h/2);
  const squash = p.onGround ? 1 : 1 - Math.min(0.15, Math.abs(p.vy)*0.08);
  ctx.scale(1/squash, squash);
  ctx.fillStyle = p.color;
  drawRoundedRect(ctx, -p.w/2, -p.h/2, p.w, p.h, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6, -8, 5, 0, Math.PI*2);
  ctx.arc(6, -8, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  const dir = p.vx > 0.02 ? 1 : (p.vx < -0.02 ? -1 : 0);
  ctx.beginPath();
  ctx.arc(-6+dir*2, -8, 2.4, 0, Math.PI*2);
  ctx.arc(6+dir*2, -8, 2.4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  if (!p.finished) return;
  ctx.fillStyle = p.color;
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('✔', p.x + p.w/2, p.y - 10);
}

/* ========================= ГЕЙМ-ЛУП ========================= */
function gameLoop(now) {
  if (!running) return;
  const dt = Math.min(32, now - lastTime);
  lastTime = now;

  updatePlayerPhysics(players.A, myRole === 'A' ? input : remoteInput, dt, now);
  updatePlayerPhysics(players.B, myRole === 'B' ? input : remoteInput, dt, now);

  if (remoteState) {
    const other = otherPlayer();
    other.x += (remoteState.x - other.x) * 0.3;
    other.y += (remoteState.y - other.y) * 0.3;
    if (remoteState.finished && !other.finished) {
      other.finished = true;
      updateProgressHud();
    }
  }

  sendNetworkUpdates(dt);
  try {
    draw(now);
  } catch (e) {
    // Не даём ошибке отрисовки полностью остановить игровой цикл —
    // логика и сеть продолжат работать, даже если один кадр не нарисовался.
    console.error('Ошибка отрисовки:', e);
  }

  requestAnimationFrame(gameLoop);
}

function startGame() {
  loadLevel(0);
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

/* ========================= УПРАВЛЕНИЕ ========================= */
function bindHold(el, onDown, onUp) {
  el.addEventListener('touchstart', (e)=>{ e.preventDefault(); onDown(); }, {passive:false});
  el.addEventListener('touchend', (e)=>{ e.preventDefault(); onUp(); }, {passive:false});
  el.addEventListener('touchcancel', (e)=>{ e.preventDefault(); onUp(); }, {passive:false});
  el.addEventListener('mousedown', (e)=>{ e.preventDefault(); onDown(); });
  el.addEventListener('mouseup', (e)=>{ e.preventDefault(); onUp(); });
  el.addEventListener('mouseleave', (e)=>{ onUp(); });
}

bindHold(document.getElementById('leftBtn'), ()=>input.left=true, ()=>input.left=false);
bindHold(document.getElementById('rightBtn'), ()=>input.right=true, ()=>input.right=false);
bindHold(document.getElementById('jumpBtn'), ()=>input.jump=true, ()=>input.jump=false);

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') input.jump = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') input.jump = false;
});
</script>
